<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102820" />
    <meta name="description" content="Tablet kiosk prayer times with geolocation and adhan playback." />
    <title>Adhan</title>
    <script>
      document.documentElement.dataset.theme =
        (new Date().getHours() >= 6 && new Date().getHours() < 19) ? "light" : "dark";
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <div>
            <p class="label">Adhan <span class="arabic-label" lang="ar">الأذان</span></p>
            <h1 id="locationName">Finding location...</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="audioButton" class="icon-button" type="button" title="Enable adhan audio" aria-label="Enable adhan audio">
            <span aria-hidden="true">♪</span>
          </button>
          <button id="settingsButton" class="icon-button" type="button" title="Set Claude API key" aria-label="Set Claude API key">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </div>

      <section class="hero" aria-label="Current time and next prayer">
        <div class="now-block">
          <p class="label">Now</p>
          <div id="clock" class="clock">--:--</div>
          <div class="date-stack">
            <div id="date" class="date">Loading date</div>
            <div id="hijriDate" class="hijri-date">Loading Islamic date</div>
          </div>
        </div>

        <div class="hero-divider" aria-hidden="true"><span></span></div>

        <div class="next-block">
          <p class="label">Next Prayer</p>
          <div id="nextPrayer" class="next-prayer">--</div>
          <div id="countdown" class="countdown">--:--:--</div>
        </div>
      </section>

      <div id="status" class="status" role="status">Requesting browser geolocation.</div>

      <section class="schedule-strip" aria-label="Daily prayer schedule">
        <div class="strip-heading">
          <h2>Today</h2>
        </div>
        <div id="prayerList" class="prayer-list"></div>
      </section>

      <section class="info-row" aria-label="Dua of the day and nearby masjid">
        <div class="info-card">
          <h2>Dua of the Day</h2>
          <div id="duaCard" class="dua-card"></div>
        </div>

        <div class="info-card">
          <h2>Nearby Masjid</h2>
          <div id="masjidCard" class="masjid-card">
            <p class="masjid-empty">Set a Claude API key (⚙) to look up the nearest masjid and iqama times.</p>
          </div>
        </div>
      </section>
    </main>

    <div id="settingsOverlay" class="settings-overlay" hidden>
      <div id="settingsDialog" class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-form">
          <div class="section-heading">
            <h2 id="settingsTitle">Settings</h2>
            <button type="button" id="settingsCloseButton" class="icon-button settings-close" aria-label="Close settings">
              <span aria-hidden="true">×</span>
            </button>
          </div>

          <label class="settings-field">
            <span class="label">Calculation method</span>
            <select id="methodSelect" aria-label="Calculation method">
              <option value="MWL">Muslim World League</option>
              <option value="ISNA">ISNA</option>
              <option value="Egypt">Egyptian Authority</option>
              <option value="Makkah">Umm al-Qura, Makkah</option>
              <option value="Karachi">Karachi</option>
            </select>
          </label>

          <label class="settings-field">
            <span class="label">Claude API key</span>
            <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-ant-..." />
            <span class="settings-hint">Used to look up the nearest masjid's iqama times. Stored only in this browser.</span>
          </label>

          <label class="settings-field">
            <span class="label">Adhan reciter</span>
            <div class="select-row">
              <select id="adhanReciterSelect"></select>
              <button type="button" id="adhanPreviewPlay" class="preview-button" aria-label="Preview adhan reciter">▶</button>
              <button type="button" id="adhanPreviewStop" class="preview-button" aria-label="Stop preview" disabled>■</button>
            </div>
          </label>

          <label class="settings-field">
            <span class="label">Fajr adhan</span>
            <div class="select-row">
              <select id="fajrAdhanSelect"></select>
              <button type="button" id="fajrPreviewPlay" class="preview-button" aria-label="Preview Fajr adhan">▶</button>
              <button type="button" id="fajrPreviewStop" class="preview-button" aria-label="Stop preview" disabled>■</button>
            </div>
          </label>

          <div class="settings-field">
            <span class="label">Play adhan for</span>
            <div id="prayerToggleList" class="toggle-list"></div>
          </div>
        </div>
      </div>
    </div>

    <audio id="adhanAudio" preload="auto"></audio>
    <script src="/azkar.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
