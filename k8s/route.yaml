apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: adhan-route
spec:
  parentRefs:
    - name: web-gw
      namespace: default
  hostnames:
    - "adhan.shafi.org"
  rules:
    # /yt/* goes to the random-YouTube-adhan service (yt/server.py).
    - matches:
        - path:
            type: PathPrefix
            value: /yt
      backendRefs:
        - name: adhan-yt
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: adhan-app
          port: 80
